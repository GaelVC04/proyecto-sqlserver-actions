name: Generate SQL Report

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SQL Server
        run: |
          docker run -d \
            --name sqlserver \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="${{ secrets.MSSQL_SA_PASSWORD }}" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server
        run: |
          for i in {1..60}; do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U sa \
              -P "${{ secrets.MSSQL_SA_PASSWORD }}" \
              -C \
              -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            sleep 5
          done

          echo "SQL Server failed to start"
          exit 1

      - name: Create database
        run: |
          docker cp sql/create_database.sql sqlserver:/tmp/create_database.sql

          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "${{ secrets.MSSQL_SA_PASSWORD }}" \
            -C \
            -i /tmp/create_database.sql

      - name: Create tables
        run: |
          docker cp sql/create_tables.sql sqlserver:/tmp/create_tables.sql

          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "${{ secrets.MSSQL_SA_PASSWORD }}" \
            -C \
            -i /tmp/create_tables.sql

      - name: Create stored procedure
        run: |
          docker cp sql/create_procedure.sql sqlserver:/tmp/create_procedure.sql

          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "${{ secrets.MSSQL_SA_PASSWORD }}" \
            -C \
            -i /tmp/create_procedure.sql

      - name: Create trigger
        run: |
          docker cp sql/create_trigger.sql sqlserver:/tmp/create_trigger.sql

          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "${{ secrets.MSSQL_SA_PASSWORD }}" \
            -C \
            -i /tmp/create_trigger.sql

      - name: Insert test data
        run: |
          docker cp sql/test_data.sql sqlserver:/tmp/test_data.sql

          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "${{ secrets.MSSQL_SA_PASSWORD }}" \
            -C \
            -i /tmp/test_data.sql

      - name: Generate CSV report
        run: |
          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "${{ secrets.MSSQL_SA_PASSWORD }}" \
            -C \
            -d EmpresaDB \
            -h -1 \
            -W \
            -Q "SET NOCOUNT ON; SELECT 'Producto,Existencias' UNION ALL SELECT CONCAT(Producto, ',', Existencias) FROM Inventario;" \
            > reporte_inventario.csv

      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporte-inventario
          path: reporte_inventario.csv
          retention-days: 30